name: Sync to Gitee

on:
  push:
    branches: [ "main" ]        # 当推送到 main 分支时触发
  workflow_dispatch:            # 也支持手动触发（点按钮）

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取代码（包括所有分支历史）
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 配置 SSH 密钥（用刚才存的私钥）
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}

      # 3. 添加 Gitee 为远程仓库
      - name: Add Gitee remote
        run: |
          git remote add gitee git@gitee.com:zzhzhouzhou/zzh-music-player.git

      # 4. 推送到 Gitee：Gitee 的 SSH 网关（ssh-pilot）偶发短时连接失败
      #（实测出现过无输出 8 秒超时 exit 1，手动重跑即成功），这里加重试，
      # 消除瞬时抖动造成的红叉。密钥被拒（认证错误）会立刻失败，不会
      # 被循环吞掉成假绿——重试只对"连接类瞬断"有效。
      - name: Push to Gitee
        run: |
          ssh-keyscan -t ed25519 gitee.com >> ~/.ssh/known_hosts
          for i in 1 2 3; do
            echo "gitee-push attempt $i"
            if git push gitee main --force; then exit 0; fi
            echo "push failed, retrying in 5s..."
            sleep 5
          done
          exit 1
